name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: python -m pip install -r requirements-data.txt
      - run: npm run test:data-refresh
      - run: npm test
      - run: npm run validate:data
      - run: npm run build
      - run: npm run check:release
